services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-auditflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditflow} -d ${POSTGRES_DB:-auditflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-auditflow}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-auditflow}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/code
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
